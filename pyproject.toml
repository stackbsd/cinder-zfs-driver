[project]
name = "cinder-zfs-driver"
version = "0.0.0"
description = "Cinder ZFS driver for FreeBSD"
readme = "README.md"
authors = [
    { name = "joshiggins", email = "josh@joshh.info" }
]
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cinder-zfs-receive = "cinder_zfs_driver.receive:main"

[build-system]
requires = ["uv_build>=0.11.28"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["cinder_zfs_driver", "cinder.zfs"]
namespace = true
